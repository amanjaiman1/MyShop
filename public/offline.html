<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Aurelia</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #fdfaf8 0%, #fbf7f4 45%, #f7f0ea 100%);
        color: #241f1e;
      }
      .card {
        max-width: 26rem;
        text-align: center;
        background: #fffdfc;
        border: 1px solid #ece1d9;
        border-radius: 24px;
        padding: 2.5rem 2rem;
        box-shadow: 0 18px 34px -12px rgba(74, 51, 42, 0.14);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #a72350 0%, #7c1b3c 55%, #5b2a4a 100%);
        color: #fbf7f4;
        font-family: Georgia, serif;
        font-size: 1.75rem;
        font-weight: 600;
        box-shadow: 0 10px 24px -10px rgba(158, 31, 71, 0.5);
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        color: #140f0f;
      }
      p { color: #796c66; line-height: 1.6; margin: 0 0 1.5rem; font-size: 0.95rem; }
      .note {
        font-size: 0.8rem;
        color: #a2938c;
        background: #faf5f1;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        margin-bottom: 1.5rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: linear-gradient(135deg, #a72350 0%, #7c1b3c 55%, #5b2a4a 100%);
        color: #fffaf7;
        font-size: 0.95rem;
        font-weight: 500;
        border-radius: 12px;
        padding: 0.85rem 1.75rem;
        box-shadow: 0 10px 24px -10px rgba(158, 31, 71, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">A</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Aurelia needs an internet connection to load your shop and to record any
        sale or purchase safely.
      </p>
      <div class="note">
        Nothing was lost. To protect your books, Aurelia never records a
        transaction it cannot confirm with the server.
      </div>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
